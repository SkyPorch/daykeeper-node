name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Branch protection requires one stable, non-matrix `package` context. Keep
  # the Node-version matrix as the coverage gate, then publish one aggregate
  # result that fails closed whenever any matrix leg fails or is cancelled.
  package:
    if: ${{ always() }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Node matrix leg to pass
        env:
          MATRIX_RESULT: ${{ needs.package-matrix.result }}
        run: test "$MATRIX_RESULT" = success
